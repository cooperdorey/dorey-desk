# Builds the lesson list and publishes the site on every push to main.
name: Publish lesson cards
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build lesson list and check lessons
        run: python3 scripts/build_manifest.py
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html favicon.ico manifest.json assets lessons generators classroom admin _site/
          touch _site/.nojekyll
          # make browsers fetch the new styles and script after every update
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html _site/generators/*.html _site/admin/*.html
      # A PDF of every lesson (with and without worked solutions) for OneNote / GoodNotes.
      # Only changed lessons are rebuilt. If this step fails the site still publishes.
      - name: Restore lesson PDF cache
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: lesson-pdfs-${{ github.sha }}
          restore-keys: lesson-pdfs-
      - name: Build lesson PDFs
        continue-on-error: true
        run: |
          sudo apt-get install -y -q fonts-urw-base35 > /dev/null
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          python3 scripts/build_pdfs.py _site --cache .pdf-cache
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
