<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seating chart – Dorey Desk</title>
<link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icons/icon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#0F766E">
<style>
/* Matches the Dorey Desk site (assets/app.css) */
:root{--paper:#F2F3F5;--panel:#FFFFFF;--ink:#1D232B;--muted:#5E6672;--line:#D9DDE3;--brand:#0F766E;--glass:#DCEBF5;--glass-line:#9DB9CC;
 --ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --card:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--paper:#16191E;--panel:#20242B;--ink:#ECEEF1;--muted:#A5ACB7;--line:#343A43;
 --brand:#5FCFC2;--glass:#243746;--glass-line:#46687F;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 28px;padding:22px clamp(16px,5vw,64px) 0}
.wordmark{font-family:var(--card);font-weight:700;font-size:19px;color:var(--brand);text-decoration:none}
.crumbs{display:flex;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs>*+*::before{content:"›";margin:0 8px;color:var(--line)}
.intro{max-width:1100px;margin:0 auto;padding:28px clamp(16px,5vw,64px) 0}
.intro h1{font-family:var(--card);font-weight:700;font-size:clamp(32px,5vw,48px);line-height:1.05;margin:0}
.intro p{margin:8px 0 0;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:24px clamp(16px,5vw,64px) 64px}
svg{display:block;width:100%;height:auto;font-family:var(--ui)}
.wall{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.floor{fill:var(--panel)}
.glass{fill:var(--glass);stroke:var(--glass-line);stroke-width:1.5}
.desk{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.lectern{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}
.door{fill:none;stroke:var(--muted);stroke-width:2}
.lbl{fill:var(--muted);font-size:15px;font-weight:600;letter-spacing:.04em;text-anchor:middle}
</style>
</head>
<body>

<header>
  <a class="wordmark" href="../#">Dorey Desk</a>
  <nav class="crumbs" aria-label="Where you are"><a href="../#">Home</a><a href="../#classroom">Classroom</a><span>Seating chart</span></nav>
</header>

<div class="intro">
  <h1>Seating chart</h1>
  <p>3 rows of 8 desks, each split into two tables of 4, then a front row of 4 desks and one double-length desk. The front is at the bottom.</p>
</div>

<main>
  <svg id="room" viewBox="0 0 1000 534" role="img" aria-label="Classroom plan: three rows of eight desks in two tables of four, a front row of four desks and one double-length desk, windows down the left wall, door on the right wall near the bottom corner, lectern bottom-left"></svg>
</main>

<script>
(function(){
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const el = (name, attrs, text) => { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; return e };

// Room: x 10–990. Windows run down the whole left wall, the door is in the right wall near the bottom corner.
const ROOM = {x:10, y:10, w:980, h:514}, WIN_W = 36, BOTTOM = ROOM.y + ROOM.h;
const DESK = {w:84, h:52}, TABLE = 4, ROWS = 3, AISLE = 80, ROW_GAP = 48, TOP = 50;

const svg = document.getElementById('room');
svg.appendChild(el('rect', {class:'floor', x:ROOM.x, y:ROOM.y, width:ROOM.w, height:ROOM.h}));

// windows (left wall, full height)
svg.appendChild(el('rect', {class:'glass', x:ROOM.x, y:ROOM.y, width:WIN_W, height:ROOM.h}));
svg.appendChild(el('text', {class:'lbl', transform:`translate(${ROOM.x + WIN_W/2 + 5} ${ROOM.y + ROOM.h/2}) rotate(-90)`}, 'Windows'));

// walls, with a gap in the right-hand wall for the door (near the bottom corner)
const gapTop = BOTTOM - 110, gapBottom = BOTTOM - 30;
svg.appendChild(el('path', {class:'wall', d:`M990 ${gapTop} V10 H10 V${BOTTOM} H990 V${gapBottom}`}));
// door: hinge at the bottom of the gap, leaf swung open into the room along the bottom, with its arc
svg.appendChild(el('path', {class:'door', d:`M990 ${gapBottom} H910 M990 ${gapTop} A80 80 0 0 0 910 ${gapBottom}`}));
svg.appendChild(el('text', {class:'lbl', x:866, y:gapTop + 52}, 'Door'));

// desks, numbered row by row from the top left. Tables of 4 are pushed together.
const blockW = 2*TABLE*DESK.w + AISLE, x0 = ROOM.x + WIN_W + (ROOM.w - WIN_W - blockW)/2;
const rowY = r => TOP + r*(DESK.h + ROW_GAP);
const xOf = k => x0 + k*DESK.w + (k >= TABLE ? AISLE : 0);           // k = 0–7 along a full row
let n = 0;
const desk = (x, y, w) => {
  const g = el('g', {'data-desk': ++n});
  g.appendChild(el('rect', {class:'desk', x, y, width:w, height:DESK.h, rx:4}));
  svg.appendChild(g);
};
for (let r = 0; r < ROWS; r++) for (let k = 0; k < 2*TABLE; k++) desk(xOf(k), rowY(r), DESK.w);
// front row: 4 desks on the left, then one desk twice as long on the right
for (let k = 0; k < TABLE; k++) desk(xOf(k), rowY(ROWS), DESK.w);
desk(xOf(2*TABLE) - 2*DESK.w, rowY(ROWS), 2*DESK.w);                    // right-aligned with the tables above

// teacher lectern: bottom-left corner, turned 45°
const L = {w:84, h:46, cx:ROOM.x + WIN_W + 76, cy:BOTTOM - 58};
const lec = el('g', {transform:`rotate(45 ${L.cx} ${L.cy})`});
lec.appendChild(el('rect', {class:'lectern', x:L.cx - L.w/2, y:L.cy - L.h/2, width:L.w, height:L.h, rx:4}));
lec.appendChild(el('text', {class:'lbl', x:L.cx, y:L.cy + 5}, 'Lectern'));
svg.appendChild(lec);
})();
</script>
</body>
</html>
