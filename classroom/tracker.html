<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Class Tracker – Dorey Desk</title>
<link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icons/icon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#0F766E">
<style>
:root{--paper:#F2F3F5;--panel:#FFFFFF;--ink:#1D232B;--muted:#5E6672;--line:#D9DDE3;--brand:#0F766E;--brand-ink:#FFFFFF;--tint:#E3F2F0;--bad:#B42318;--badbg:#FDECEA;--warn:#8A5A00;--warnbg:#FFF4D6;
 --ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --card:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--paper:#16191E;--panel:#20242B;--ink:#ECEEF1;--muted:#A5ACB7;--line:#343A43;--brand:#5FCFC2;--brand-ink:#062A26;--tint:#1B3A37;--bad:#F4A39B;--badbg:#4A2420;--warn:#F2CB7A;--warnbg:#44361A;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:18px clamp(16px,4vw,48px) 64px}
.home{font-family:var(--card);font-weight:700;font-size:16px;color:var(--brand);text-decoration:none}
.crumbs{margin-top:4px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs>*+*::before{content:"›";margin:0 6px;color:var(--line)}
h1{font-family:var(--card);font-weight:700;font-size:clamp(28px,4.5vw,42px);line-height:1.05;margin:14px 0 4px}
h2{font-family:var(--card);font-size:19px;margin:0 0 8px}
.lead{margin:0;color:var(--muted)}
button,select,input,textarea{font:inherit;font-size:14px}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--brand);background:transparent;color:var(--brand);cursor:pointer}
button:hover:not(:disabled){background:var(--tint)}
button:disabled{opacity:.5;cursor:default}
button.solid{background:var(--brand);color:var(--brand-ink);font-weight:600}
button.solid:hover:not(:disabled){background:var(--brand);filter:brightness(1.08)}
button.quiet{border-color:var(--line);color:var(--ink)}
button.sm{padding:4px 9px;font-size:13px}
input[type=text],input[type=date],input[type=number],select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
textarea{width:100%;min-height:90px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.bar.on{border-color:var(--brand);background:var(--tint)}
.bar .msg{flex:1 1 260px;color:var(--muted);font-size:14px}
.bar.on .msg{color:var(--ink)}
.bar.dirty .msg{color:var(--warn);font-weight:600}
.groups{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 16px}
.groups button{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.groups button[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 3px 10px rgba(15,118,110,.28)}
.groups svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs{display:flex;flex-wrap:wrap;gap:2px;margin:0 0 16px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;padding:8px 14px;background:none;color:var(--muted);margin-bottom:-1px}
.tabs button:hover:not(:disabled){background:var(--tint);color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600;background:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 14px}
.tile{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tile b{display:block;font-family:var(--card);font-size:28px;line-height:1.1}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.warn{border-left-color:#C9850A}
.tile.bad{border-left-color:var(--bad)}
.tile.good{border-left-color:#2E9E6B}
.row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0;max-width:85ch}
.roll{margin:10px 0 0}
.atable{border-collapse:separate;border-spacing:5px 5px;width:100%;table-layout:fixed}
.atable td{text-align:center;padding:0;vertical-align:middle}
.atable td.st{text-align:left;white-space:nowrap;font-size:13px;width:150px;overflow:hidden;text-overflow:ellipsis}
.atable td.num{color:var(--muted);font-size:11px;width:20px}
.acell{display:block;width:100%;box-sizing:border-box;padding:5px 4px;border-radius:999px;cursor:pointer;user-select:none;font-size:11.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1.5px solid transparent}
.acell:hover{filter:brightness(1.06)}
.tally{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px;margin-top:0;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;background:var(--panel)}
.tally b{font-size:22px;font-family:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--ink);font-size:12.5px;margin:1px 3px 1px 0;border:1px solid var(--line)}
.bgrid{border-collapse:collapse;font-size:13px}
.bgrid th,.bgrid td{border:1px solid var(--line);padding:5px 4px;text-align:center}
.bgrid td.st,.bgrid th.st{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;white-space:nowrap;min-width:150px}
.bgrid thead th{background:var(--tint);cursor:pointer;font-size:12px;min-width:48px;line-height:1.2}
.bgrid thead th.st{z-index:2;cursor:default;background:var(--tint)}
.bgrid thead th small{display:block;color:var(--muted);font-weight:400;font-size:10.5px}
.bgrid tbody tr:hover td{background:var(--tint)}
.bgrid tbody tr:hover td.st{background:var(--tint)}
.bgrid input{width:17px;height:17px;margin:0;cursor:pointer;accent-color:var(--brand)}
.bgrid .done{background:var(--tint)}
.tag.owed{background:var(--warnbg);color:var(--warn);border-color:transparent}
.empty{color:var(--muted);padding:10px 0}
.rgrid{border-collapse:collapse;font-size:13px}
.rgrid th,.rgrid td{border:1px solid var(--line);padding:4px 5px;text-align:center;vertical-align:middle}
.rgrid .st{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;white-space:nowrap;min-width:150px}
.rgrid thead th{background:var(--tint);font-weight:600;color:var(--ink)}
.rgrid thead th.st,.rgrid tfoot th.st{z-index:2;background:var(--tint)}
.rgrid tfoot th,.rgrid tfoot td{background:var(--tint)}
.rgrid tfoot td{font-weight:600}
.rgrid .rname{width:96px;text-align:center;font-weight:600}
.rgrid .rnum{width:64px;text-align:center}
.rgrid .rmk{width:60px;text-align:center;padding:4px 4px}
.rgrid .rmk.over{border-color:var(--bad);color:var(--bad)}
.rgrid .rp{display:block;font-size:11px;color:var(--muted);min-height:15px}
.rgrid .rdel{padding:0 6px;font-size:12px;margin-left:3px}
.rgrid td.ravg{font-weight:700;min-width:62px}
.rgrid .rrow th{font-weight:500;color:var(--muted);font-size:12px}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:18px 20px;max-width:420px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .row{margin-top:12px}
.err{color:var(--bad);font-size:13px;margin:6px 0 0}
#printArea{display:none}
.slipPage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:190mm;height:277mm;gap:0;page-break-after:always;break-after:page;margin:0 auto}
.slipPage:last-child{page-break-after:auto;break-after:auto}
.slip{border:1px dashed #888;padding:7mm 8mm;font-family:Arial,Helvetica,sans-serif;font-size:11pt;color:#000;overflow:hidden}
.slip h3{margin:0 0 1mm;font-size:15pt}
.slip .cls{color:#444;font-size:10pt;margin:0 0 4mm}
.slip ul{margin:1mm 0 4mm;padding-left:5mm}
.slip li{margin:1mm 0}
.slip .box{display:inline-block;width:3.5mm;height:3.5mm;border:1px solid #000;margin-right:2mm;vertical-align:-0.5mm}
.slip .todo{font-size:10pt;margin-top:3mm}
.slip .hand{margin-top:4mm;font-size:10pt}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  .wrap{display:none}
  #printArea{display:block}
  #printArea .sumTable{font-family:Arial,Helvetica,sans-serif;color:#000}
  #printArea .sumTable table{font-size:10pt}
  #printArea .sumTable th,#printArea .sumTable td{border-bottom:1px solid #999;color:#000}
  #printArea .sumPrint{font-family:Arial,Helvetica,sans-serif;color:#000}
  #printArea .sumPrint .cls{font-size:12pt;font-weight:bold;margin:0 0 2mm}
  #printArea .sumPrint .ptitle{font-size:15pt;min-height:9mm;border-bottom:1px solid #000;margin:0 0 5mm;padding-bottom:1mm}
  #printArea .sumPrint table{width:100%;border-collapse:collapse;font-size:10.5pt}
  #printArea .sumPrint th{text-align:left;border-bottom:1.5px solid #000;padding:2mm 2mm}
  #printArea .sumPrint td{border-bottom:1px solid #000;padding:0 2mm;height:15mm;vertical-align:top}
  #printArea .sumPrint td.n{text-align:center;width:22mm;vertical-align:middle}
  #printArea .sumPrint td.nm{width:48mm;vertical-align:middle}
  #printArea .sumPrint th.rsn,#printArea .sumPrint td.rsn{width:34mm;vertical-align:middle;font-size:9.5pt}
  #printArea .sumPrint th.cmt,#printArea .sumPrint td.cmt{width:auto}
  #printArea .natPage{font-family:Arial,Helvetica,sans-serif;color:#000;page-break-after:always;font-size:8.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea .natPage:last-child{page-break-after:auto}
  #printArea .natPage h2{text-align:center;font-size:13pt;margin:0 0 2mm;padding-bottom:1mm;border-bottom:1px solid #000}
  #printArea .natHead{width:100%;border-collapse:collapse;margin-bottom:3mm}
  #printArea .natHead td{border:1px solid #000;padding:1.2mm 2mm;font-size:9.5pt}
  #printArea .natHead td.l{width:30mm}
  #printArea .natSec{display:grid;grid-template-columns:13mm 25mm 42mm 1fr 36mm;border:1px solid #000;border-bottom:0;margin-top:0;page-break-inside:avoid}
  #printArea .natSec>div{border-right:1px solid #ccc;padding:0}
  #printArea .natSec .hd{background:#7f7f7f;color:#fff;text-align:center;font-size:7.5pt;font-weight:bold;padding:0.8mm 0;letter-spacing:.2px}
  #printArea .natSec .cell{padding:1mm 1.5mm;min-height:6mm}
  #printArea .natLast{border-bottom:1px solid #000}
  #printArea .natSec .num{text-align:center;font-weight:bold;font-size:10pt;padding-top:1.5mm}
  #printArea .natSec .line{display:flex;align-items:center;gap:1mm;margin-bottom:1.2mm}
  #printArea .natSec .fld{flex:1;border:1px solid #000;height:4.6mm}
  #printArea .natSec .opt{display:flex;justify-content:space-between;align-items:center;padding:0 1mm 0 1.5mm;height:4.9mm;font-size:8pt}
  #printArea .natSec .bx{display:inline-block;width:4mm;height:4mm;border:1px solid #000;margin-left:2mm;text-align:center;line-height:4mm;font-weight:bold;font-size:9pt}
  #printArea .natSec .yn{display:flex;gap:1.5mm;align-items:center;justify-content:center;padding-top:2mm;font-size:8pt}
  #printArea .natSec .yn .bx{width:7mm;margin:0}
  #printArea .natSec .top{font-size:7pt;color:#333;text-align:center;line-height:1.2}
  #printArea .sumPrint .pct{display:inline-block;min-width:15mm;padding:1mm 2mm;border-radius:3mm;color:#fff;font-weight:bold;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../#">Dorey Desk</a>
  <nav class="crumbs" aria-label="Where you are"><a href="../#">Home</a><a href="../#classroom">Classroom</a><span>Class Tracker</span></nav>
  <h1>Class Tracker</h1>

  <div class="bar" id="fileBar">
    <button class="solid" id="openDir">Open folder</button>
    <button class="quiet" id="openFiles">Open files…</button>
    <span class="msg" id="fileMsg">No folder open.</span>
    <button id="saveAll" disabled>Save</button>
    <button class="quiet" id="dlAll" disabled>Download both</button>
  </div>
  <input type="file" id="fileIn" accept=".csv,text/csv" multiple hidden>

  <div class="groups" role="tablist" id="groups">
    <button role="tab" aria-selected="false" data-g="over"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</button>
    <button role="tab" aria-selected="true" data-g="att"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/></svg>Attendance</button>
    <button role="tab" aria-selected="false" data-g="work"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Coursework</button>
    <button role="tab" aria-selected="false" data-g="assess"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="m9 14 2 2 4-4"/></svg>Assessment</button>
    <button role="tab" aria-selected="false" data-g="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Setup</button>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" aria-selected="false" data-t="dash">Dashboard</button>
    <button role="tab" aria-selected="true" data-t="entry">Quick entry</button>
    <button role="tab" aria-selected="false" data-t="sum">Attendance summary</button>
    <button role="tab" aria-selected="false" data-t="book">Book work</button>
    <button role="tab" aria-selected="false" data-t="catch">Catch-up slips</button>
    <button role="tab" aria-selected="false" data-t="naw">N-awards</button>
    <button role="tab" aria-selected="false" data-t="lsq">LSQ results</button>
    <button role="tab" aria-selected="false" data-t="asm">Assessments</button>
    <button role="tab" aria-selected="false" data-t="cls">Classes</button>
  </div>

  <section id="t-dash" hidden>
    <div class="row">
      <label class="f">Class<select id="dClass"></select></label>
      <label class="f">Fortnight ending<input type="date" id="dEnd"></label>
      <label class="f">Lessons<input type="number" id="dN" min="1" value="8" style="width:72px"></label>
    </div>
    <div class="tiles" id="dTiles"></div>
    <div class="card" style="padding:6px 10px"><h2 style="margin:8px 4px 2px">Fortnight attendance</h2><div id="dFort"></div></div>
    <div class="card" style="padding:6px 10px"><div id="dList"></div></div>
  </section>

  <section id="t-entry">
    <div class="row">
      <label class="f">Date<input type="date" id="eDate"></label>
      <label class="f">Class<select id="eClass"></select></label>
      <label class="f">Lesson missed<input type="text" id="eLesson" placeholder="2.08" size="7"></label>
    </div>
    <div id="roll" class="roll"></div>
    <div class="tally" id="tally">
      <span><b id="awayCount">0</b> away</span>
      <span class="note" style="margin:0" id="presentCount"></span>
      <span style="flex:1"></span>
      <button class="quiet" id="eClear">All present</button>
      <button class="solid" id="eSave">Save absences</button>
    </div>
    <p class="note" id="eMsg"></p>
    <details class="card"><summary>Reasons</summary>
      <div id="reasonList" class="note" style="margin:6px 0 0"></div>
    </details>
  </section>

  <section id="t-catch" hidden>
    <div class="row">
      <label class="f">Class<select id="cClass"></select></label>
      <label class="f">Hand in by<input type="date" id="cDeadline"></label>
      <button class="solid" id="cPrint">Print slips for ticked students</button>
    </div>
    <div class="card" style="padding:6px 10px"><div id="cList"></div></div>
  </section>

  <section id="t-book" hidden>
    <div class="row">
      <label class="f">Class<select id="bClass"></select></label>
      <label class="f">Topic<select id="bTopic"></select></label>
      <span id="bMsg" class="note" style="margin:0"></span>
    </div>
    <div class="row" style="padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)">
      <label class="f">Lesson<select id="bLesson"></select></label>
      <button class="solid" id="bApply">Tick present, untick absent</button>
      <span id="bApplyMsg" class="note" style="margin:0"></span>
    </div>
    <div class="card" style="padding:0;overflow:auto;max-height:70vh"><div id="bGrid"></div></div>
  </section>

  <section id="t-lsq" hidden>
    <div class="row">
      <label class="f">Class<select id="lClass"></select></label>
      <button class="solid" id="lAdd">Add LSQ</button>
      <span id="lMsg" class="note" style="margin:0"></span>
    </div>
    <div class="card" style="padding:0;overflow-x:auto"><div id="lGrid"></div></div>
  </section>

  <section id="t-asm" hidden>
    <div class="row">
      <label class="f">Class<select id="mClass"></select></label>
      <button class="solid" id="mAdd">Add task</button>
      <span id="mMsg" class="note" style="margin:0"></span>
    </div>
    <div class="card" style="padding:0;overflow-x:auto"><div id="mGrid"></div></div>
  </section>

  <section id="t-sum" hidden>
    <div class="row">
      <label class="f">Class<select id="sClass"></select></label>
      <label class="f">From<input type="date" id="sFrom"></label>
      <label class="f">To<input type="date" id="sTo"></label>
      <label class="f">Lessons in this range<input type="number" id="sN" min="1" value="10" style="width:90px"></label>
      <label class="f">Term<select id="sTerm"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
      <label class="f">Week<select id="sWeek"><option>5</option><option>9</option></select></label>
      <button class="quiet" id="sPrint">Print</button>
      <button class="quiet" id="sCsv">Download as CSV</button>
    </div>
    <div class="card" style="padding:6px 10px"><div id="sTable"></div></div>
  </section>

  <section id="t-naw" hidden>
    <div class="card">
      <h2>Log an N-award warning</h2>
      <div class="row">
        <label class="f">Class<select id="nClass"></select></label>
        <label class="f">Topic<select id="nTopic"></select></label>
        <label class="f">Date issued<input type="date" id="nDate"></label>
      </div>
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap">
        <div class="f" style="flex:0 0 210px">

      <div class="row" style="margin-top:8px"><button class="solid" id="nAdd">Add warning</button><button class="quiet" id="nSheet" type="button">Print tracker sheets (ticked students)</button><span id="nMsg" class="note" style="margin:0"></span></div>

    <div class="row">
      <label class="f">Class<select id="kClass"></select></label>
      <label class="f">Course<select id="kCourse"></select></label>

<dialog id="dlg"><form method="dialog" id="dlgForm"><h2 id="dlgTitle"></h2><div id="dlgBody"></div><p class="err" id="dlgErr" hidden></p>
<div class="row"><button type="button" class="solid" id="dlgOk">OK</button><button type="button" class="quiet" id="dlgCancel">Cancel</button></div></form></dialog>

<div id="printArea"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CC=['id','last','first','class','course','left'];
const AC=['date','period','class','id','reason','lesson','status','notes'];
const BC=['id','lesson','done'];
const NC=['id','date','number','topic','outcomes','detail','status','crt','ht','dp'];
const IC=['class','kind','item','name','outof','cmean','csd'];
const RC=['class','kind','item','id','mark'];
let NAWARD={classroomCodes:{},outcomes:{}};
const DEFAULT_REASONS=['Explained','Learning Enrichment','SBAT','School Business','Sick','Suspension','Tafe','Truant','Unexplained','Wellbeing','Work Placement'];
const S={classes:[],abs:[],book:new Map(),naw:[],ritems:[],res:new Map(),dir:null,handles:{},loaded:false,dirty:false};
const E={marks:{},reason:''};
const TOPICS=[];
const COURSES=[];
const LESSON_TITLE=new Map();
const LESSON_ANY=new Map();
const LESSON_AMBIG=new Set();
let SUMN={};
const bKey=(id,lesson)=>id+'|'+lesson;

/* ---------- CSV ---------- */
function parseCSV(t){
  t=String(t||'').replace(/^﻿/,'');
  const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n')i++; row.push(f);f='';out.push(row);row=[] }
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);out.push(row)}
  const rows=out.filter(r=>r.length>1||(r.length===1&&r[0].trim()!==''));
  if(!rows.length) return {head:[],rows:[]};
  const head=rows[0].map(h=>h.trim().toLowerCase());
  return {head,rows:rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]==null?'':r[i]).trim());return o})};
}
function toCSV(cols,rows){
  const cell=v=>{v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return [cols.join(',')].concat(rows.map(r=>cols.map(c=>cell(r[c])).join(','))).join('\r\n')+'\r\n';
}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
function isoDate(s){
  s=String(s||'').trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){const p=s.split('-');return p[0]+'-'+pad(+p[1])+'-'+pad(+p[2])}
  let m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/); // d/m/y (AU) from Excel
  if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1])}
  return s;
}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function showDate(iso){if(!iso)return '';const d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}
function showShort(iso){if(!iso)return '';const d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}

/* ---------- reasons ---------- */
let REASONS=DEFAULT_REASONS.slice();
function getReasons(){return REASONS.length?REASONS:DEFAULT_REASONS.slice()}
function setReasons(a){REASONS=a.slice()}
async function loadReasons(){
  try{const r=await fetch('./reasons.json',{cache:'no-store'});
    if(r.ok){const j=await r.json();if(Array.isArray(j)&&j.length)REASONS=j.map(String)}}catch(e){}
  refreshReasons();if(S.loaded)drawRoll();
}
const rName=r=>r.replace(/\*+$/,'').trim();
const noCatch=r=>/\*$/.test(r.trim());
function reasonNoCatch(name){return getReasons().some(r=>rName(r)===name&&noCatch(r))}

/* ---------- model helpers ---------- */
const isGone=r=>!!(r.left&&r.left.trim()&&r.left.trim().toLowerCase()!=='no');
function activeClasses(){return [...new Set(S.classes.filter(r=>!isGone(r)).map(r=>r.class))].sort()}
function allClassesAny(){return [...new Set(S.classes.map(r=>r.class))].sort()}
function splitName(name){
  name=String(name||'').trim();
  if(name.includes(',')){const p=name.split(',');return {last:p[0].trim(),first:p.slice(1).join(',').trim()}}
  const t=name.split(/\s+/);
  if(t.length<2)return {last:name,first:''};
  return {last:t.pop(),first:t.join(' ')};
}
function fullName(r){return r?(((r.first||'')+' '+(r.last||'')).trim()||r.name||''):''}
function cmpRow(a,b){return (a.last||'').localeCompare(b.last||'')||(a.first||'').localeCompare(b.first||'')||(a.name||'').localeCompare(b.name||'')}
function rowOf(id){return S.classes.find(x=>x.id===id)}
function cmpId(ida,idb){return cmpRow(rowOf(ida)||{},rowOf(idb)||{})}
function studentsIn(cls){return S.classes.filter(r=>r.class===cls&&!isGone(r)).sort(cmpRow)}
function nameOf(id){const r=rowOf(id);return r?fullName(r):id}
function classCourse(cls){const r=S.classes.find(x=>x.class===cls&&x.course);return r?r.course:''}
function nextId(cls){
  let max=0;const re=new RegExp('^'+cls.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'-(\\d+)$');
  S.classes.forEach(r=>{const m=re.exec(r.id);if(m)max=Math.max(max,+m[1])});
  S.abs.forEach(r=>{const m=re.exec(r.id);if(m)max=Math.max(max,+m[1])});
  return cls+'-'+pad(max+1);
}
function markDirty(){S.dirty=true;updateBar()}

/* ---------- files ---------- */
const FSA=typeof window.showDirectoryPicker==='function';
function setMsg(t){$('fileMsg').textContent=t}
function updateBar(){
  const bar=$('fileBar');
  bar.classList.toggle('on',S.loaded);
  bar.classList.toggle('dirty',S.dirty);
  $('saveAll').disabled=!S.loaded||!S.dirty||!S.dir;
  $('dlAll').disabled=!S.loaded;
  if(S.loaded){
    const where=S.dir?'Folder open: '+S.dir.name:'Files loaded (save by downloading)';
    setMsg(S.dirty?where+' · unsaved changes':where+' · '+S.classes.length+' enrolments, '+S.abs.length+' absence rows');
  }
}
function loadFromText(ct,at,bt,nt,it,rt){
  const c=parseCSV(ct),a=parseCSV(at),b=parseCSV(bt),nw=parseCSV(nt),ri=parseCSV(it),rr=parseCSV(rt);
  S.ritems=ri.rows.filter(r=>r.class&&r.kind&&r.item).map(r=>{const o={};IC.forEach(k=>o[k]=r[k]||'');return o});
  S.res=new Map();
  rr.rows.filter(r=>r.id&&r.kind&&r.item&&r.mark!=='').forEach(r=>setRes(r.kind,r.class,r.item,r.id,r.mark));
  S.classes=c.rows.filter(r=>r.id&&r.class).map(r=>{
    const o={};CC.forEach(k=>o[k]=r[k]||'');
    if(!o.first&&!o.last&&r.name){const s=splitName(r.name);o.last=s.last;o.first=s.first}
    return o;
  });
  S.abs=a.rows.filter(r=>r.date&&r.id).map(r=>{const o={};AC.forEach(k=>o[k]=r[k]||'');o.date=isoDate(o.date);return o});
  S.book=new Map();
  b.rows.filter(r=>r.id&&r.lesson).forEach(r=>S.book.set(bKey(r.id,r.lesson),r.done||'yes'));
  S.naw=nw.rows.filter(r=>r.id&&r.date).map(r=>{const o={};NC.forEach(k=>o[k]=r[k]||'');if(!o.topic&&r.task)o.topic=r.task;if(!o.detail&&r.notes)o.detail=r.notes;o.date=isoDate(o.date);o.status=/^resolved/i.test(o.status)?'resolved':'unresolved';['crt','ht','dp'].forEach(k=>{o[k]=o[k]?isoDate(o[k]):''});return o});
  S.loaded=true;S.dirty=false;
  refreshAll();updateBar();
}
function bookRows(){return [...S.book].map(([k,done])=>{const i=k.indexOf('|');return {id:k.slice(0,i),lesson:k.slice(i+1),done}})}
async function readHandle(dir,name){
  try{const h=await dir.getFileHandle(name);S.handles[name]=h;return await (await h.getFile()).text()}
  catch(e){ if(e&&e.name==='NotFoundError'){S.handles[name]=null;return ''} throw e }
}
$('openDir').onclick=async()=>{
  if(!FSA){setMsg('This browser can’t open folders. Use Open files… instead (Chrome or Edge can do both).');return}
  try{
    const dir=await window.showDirectoryPicker({mode:'readwrite'});
    S.dir=dir;S.handles={};
    const ct=await readHandle(dir,'classes.csv'),at=await readHandle(dir,'absences.csv'),bt=await readHandle(dir,'bookwork.csv'),nt=await readHandle(dir,'nawards.csv'),it=await readHandle(dir,'resultitems.csv'),rt=await readHandle(dir,'results.csv');
    loadFromText(ct,at,bt,nt,it,rt);
    if(!ct&&!at){S.dirty=true;updateBar();setMsg('Folder open: '+dir.name+' · no files found yet, starting empty. Add a class on the Classes tab.')}
  }catch(e){ if(!e||e.name!=='AbortError') setMsg('Couldn’t open that folder. '+(e&&e.message?e.message:'')) }
};
$('openFiles').onclick=()=>$('fileIn').click();
$('fileIn').onchange=async ev=>{
  const files=[...ev.target.files];ev.target.value='';
  if(!files.length)return;
  let ct='',at='',bt='',nt='',it='',rt='';
  for(const f of files){
    const t=await f.text(),p=parseCSV(t);
    if(/resultitem/i.test(f.name)||p.head.includes('outof')) it=t;
    else if(/^results/i.test(f.name)||(p.head.includes('mark')&&p.head.includes('kind'))) rt=t;
    else if(/naward/i.test(f.name)||p.head.includes('task')) nt=t;
    else if(/book/i.test(f.name)||(p.head.includes('lesson')&&p.head.includes('done'))) bt=t;
    else if(p.head.includes('date')||/absen/i.test(f.name)) at=t;
    else if(p.head.includes('last')||p.head.includes('name')||/class/i.test(f.name)) ct=t;
  }
  S.dir=null;S.handles={};
  loadFromText(ct,at,bt,nt,it,rt);
  setMsg('Files loaded'+(ct?'':' (no classes file chosen)')+(at?'':' (no absences file chosen)')+'. Save by downloading the files back over the originals.');
};
async function writeFile(name,text){
  let h=S.handles[name];
  if(!h){h=await S.dir.getFileHandle(name,{create:true});S.handles[name]=h}
  const w=await h.createWritable();await w.write(text);await w.close();
}
async function saveAll(){
  if(!S.dir||!S.loaded)return false;
  try{
    await writeFile('classes.csv',toCSV(CC,S.classes));
    await writeFile('absences.csv',toCSV(AC,S.abs));
    await writeFile('bookwork.csv',toCSV(BC,bookRows()));
    await writeFile('nawards.csv',toCSV(NC,S.naw));
    await writeFile('resultitems.csv',toCSV(IC,S.ritems));
    await writeFile('results.csv',toCSV(RC,resRows()));
    S.dirty=false;updateBar();return true;
  }catch(e){setMsg('Couldn’t save to the folder: '+(e&&e.message?e.message:e)+'. Use Download both instead.');return false}
}
$('saveAll').onclick=saveAll;
function download(name,text){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
$('dlAll').onclick=()=>{
  download('classes.csv',toCSV(CC,S.classes));
  setTimeout(()=>download('absences.csv',toCSV(AC,S.abs)),300);
  setTimeout(()=>download('bookwork.csv',toCSV(BC,bookRows())),600);
  setTimeout(()=>download('nawards.csv',toCSV(NC,S.naw)),900);
  setTimeout(()=>download('resultitems.csv',toCSV(IC,S.ritems)),1200);
  setTimeout(()=>download('results.csv',toCSV(RC,resRows())),1500);
  S.dirty=false;updateBar();
};
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});
async function persist(){markDirty();if(S.dir)await saveAll()}

/* ---------- tabs ---------- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['dash','entry','catch','book','lsq','asm','sum','naw','cls'].forEach(t=>$('t-'+t).hidden=(t!==b.dataset.t));
  showGroup(groupOf(b.dataset.t));
  refreshAll();
});
const GROUPS={over:['dash'],att:['entry','sum'],work:['book','catch','naw'],assess:['lsq','asm'],setup:['cls']};
const groupOf=t=>Object.keys(GROUPS).find(g=>GROUPS[g].includes(t));
function showGroup(g){
  document.querySelectorAll('#groups button').forEach(x=>x.setAttribute('aria-selected',x.dataset.g===g));
  document.querySelectorAll('#tabs button').forEach(x=>x.hidden=!GROUPS[g].includes(x.dataset.t));
  $('tabs').hidden=GROUPS[g].length<2;
}
document.querySelectorAll('#groups button').forEach(b=>b.onclick=()=>{
  const g=b.dataset.g,cur=document.querySelector('#tabs button[aria-selected=true]');
  const t=(cur&&GROUPS[g].includes(cur.dataset.t))?cur.dataset.t:GROUPS[g][0];
  document.querySelector('#tabs button[data-t="'+t+'"]').click();
});
showGroup('att');

/* ---------- selects ---------- */
function fillSelect(sel,vals,keep,labeler){
  const cur=keep!==false?sel.value:'';
  sel.innerHTML=vals.map(v=>'<option value="'+esc(v)+'">'+esc(labeler?labeler(v):v)+'</option>').join('');
  if(cur&&vals.includes(cur))sel.value=cur;
}
function refreshReasons(){
  const el=$('reasonList');if(el)el.textContent=getReasons().join(' · ');
}

/* ---------- quick entry ---------- */
function entryKey(){return {date:$('eDate').value,cls:$('eClass').value}}
function loadMarks(){
  const k=entryKey();E.marks={};
  S.abs.filter(r=>r.date===k.date&&r.class===k.cls).forEach(r=>E.marks[r.id]=r.reason);
  const first=S.abs.find(r=>r.date===k.date&&r.class===k.cls&&r.lesson);
  if(first)$('eLesson').value=first.lesson;
  drawRoll();
}
function emptyRoll(msg){$('roll').innerHTML='<p class="empty" style="padding:10px 12px;margin:0">'+msg+'</p>';updateTally(0,0)}
function drawRoll(){
  const k=entryKey();
  if(!S.loaded)return emptyRoll('Open your folder or files to begin.');
  if(!k.cls)return emptyRoll('No classes yet. Add students on the Classes tab.');
  const list=studentsIn(k.cls);
  if(!list.length)return emptyRoll('Nobody in this class. Add students on the Classes tab.');
  const names=getReasons().map(rName);
  const extra=[...new Set(list.map(s=>E.marks[s.id]).filter(r=>r&&!names.includes(r)))];
  const PRES='#2E9E6B',PALETTE=['#D1495B','#C9850A','#2F72C4','#7A5AB6','#1E9E8A','#C85C8E','#8A6D3B','#4C7A34'];
  const colOf=r=>r===''?PRES:PALETTE[(names.concat(extra).indexOf(r))%PALETTE.length];
  const body=list.map((s,i)=>{
    const cur=E.marks[s.id]||'',nm=fullName(s);
    const cell=(r)=>{const on=cur===r,c=colOf(r),st=on?('background:'+c+';border-color:'+c+';color:#fff;font-weight:600'):('color:'+c+';border-color:'+c);
      return '<td class="'+(on?'sel '+(r?'away':'pres'):'')+'" data-id="'+esc(s.id)+'" data-r="'+esc(r)+'"><span class="acell" style="'+st+'">'+esc(r||'Present')+'</span></td>'};
    return '<tr><td class="num">'+(i+1)+'</td><td class="st" title="'+esc(nm)+'">'+esc(nm)+'</td>'+cell('')+names.map(cell).join('')+extra.map(cell).join('')+'</tr>';
  }).join('');
  $('roll').innerHTML='<table class="atable"><tbody>'+body+'</tbody></table>';
  updateTally(list.filter(s=>E.marks[s.id]).length,list.length);
}
function updateTally(away,total){
  $('awayCount').textContent=away;
  $('presentCount').textContent=total?((total-away)+' of '+total+' present'):'';
}
$('roll').onclick=ev=>{
  const td=ev.target.closest('td[data-id]');if(!td)return;
  const id=td.dataset.id,r=td.dataset.r;
  if(r)E.marks[id]=r;else delete E.marks[id];
  drawRoll();
};
async function saveEntry(){
  const k=entryKey();
  if(!k.cls||!S.loaded)return false;
  const lesson=$('eLesson').value.trim();
  const old={};
  S.abs.filter(r=>r.date===k.date&&r.class===k.cls).forEach(r=>old[r.id]=r);
  S.abs=S.abs.filter(r=>!(r.date===k.date&&r.class===k.cls));
  Object.keys(E.marks).forEach(id=>{
    const prev=old[id],reason=E.marks[id];
    S.abs.push({date:k.date,period:prev?prev.period:'',class:k.cls,id,reason,lesson,status:prev?prev.status:'',notes:prev?prev.notes:''});
  });
  S.abs.sort((a,b)=>a.date.localeCompare(b.date)||a.class.localeCompare(b.class)||a.id.localeCompare(b.id));
  await persist();
  $('eMsg').textContent=Object.keys(E.marks).length+' away saved'+(S.dir?' to your folder':' (download to keep)');
  return true;
}
$('eSave').onclick=saveEntry;
$('eClear').onclick=()=>{E.marks={};drawRoll()};
['eDate','eClass'].forEach(id=>$(id).onchange=()=>{
  $('eLesson').value=id==='eClass'?'':$('eLesson').value;
  loadMarks();
});

/* ---------- catch-up ---------- */
function lessonTitle(cls,code){
  const t=LESSON_TITLE.get(classCourse(cls)+'|'+code);
  if(t)return t;
  if(!LESSON_AMBIG.has(code))return LESSON_ANY.get(code)||'';
  return '';
}
function catchupGroups(){
  const sel=$('cClass').value;
  const classes=sel==='all'?activeClasses():[sel];
  const out=[];
  classes.forEach(cls=>{
    const students=studentsIn(cls),idset=new Set(students.map(s=>s.id));
    const activeLessons=new Set();
    S.book.forEach((v,k)=>{const i=k.indexOf('|');if(idset.has(k.slice(0,i)))activeLessons.add(k.slice(i+1))});
    const lessons=[...activeLessons].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    students.forEach(s=>{
      const owed=lessons.filter(l=>!S.book.has(bKey(s.id,l)));
      if(owed.length)out.push({id:s.id,name:fullName(s),cls,lessons:owed});
    });
  });
  return out.sort((a,b)=>cmpId(a.id,b.id));
}
function drawCatch(){
  const box=$('cList');
  if(!S.loaded){box.innerHTML='<p class="empty">Open your folder or files first.</p>';return}
  const g=catchupGroups();
  if(!g.length){box.innerHTML='<p class="empty">No outstanding book work for this class. (Lessons appear here once they are ticked on the Book work tab.)</p>';return}
  box.innerHTML='<table><thead><tr><th style="width:34px"><input type="checkbox" id="cAll" aria-label="Tick all"></th><th>Student</th><th>Book work owed</th></tr></thead><tbody>'+
    g.map(x=>'<tr><td><input type="checkbox" class="cTick" data-id="'+esc(x.id)+'" aria-label="Tick '+esc(x.name)+'"></td><td>'+esc(x.name)+'<br><span class="note" style="margin:0">'+esc(x.cls)+'</span></td><td>'+
      x.lessons.map(l=>{const t=lessonTitle(x.cls,l);return '<span class="tag" title="'+esc(t)+'">'+esc(l)+'</span>'}).join('')+'</td></tr>').join('')+'</tbody></table>';

/* ---------- summary ---------- */
function summaryData(){
  const cls=$('sClass').value,from=$('sFrom').value,to=$('sTo').value,n=Math.max(1,+$('sN').value||1);
  const reasons=getReasons().map(rName);
  const ids=[...new Set(S.classes.filter(r=>r.class===cls&&!isGone(r)).map(r=>r.id))];
  const rows=ids.map(id=>{
    const abs=S.abs.filter(r=>r.id===id&&r.class===cls&&(!from||r.date>=from)&&(!to||r.date<=to));
    const keys=new Set(abs.map(r=>r.date+'|'+r.period));
    const by={};abs.forEach(r=>{const k=reasons.includes(r.reason)?r.reason:'Other';by[k]=(by[k]||0)+1});
    const lessons=SUMN[id]!=null?Math.max(1,SUMN[id]):n;
    return {id,name:nameOf(id),away:keys.size,lessons,pct:Math.max(0,Math.round((1-keys.size/lessons)*100)),by};
  }).sort((a,b)=>cmpId(a.id,b.id));
  const cols=reasons.slice();
  if(rows.some(r=>r.by.Other))cols.push('Other');
  return {rows,cols,cls,from,to,n};
}

/* ---------- book work ---------- */
function buildTopics(data){
  TOPICS.length=0;COURSES.length=0;LESSON_TITLE.clear();LESSON_ANY.clear();LESSON_AMBIG.clear();
  (data.years||[]).forEach(y=>(y.courses||[]).forEach(c=>{
    const key=(y.id||'')+'/'+(c.id||'');
    const label=c.short||((y.name?y.name+' ':'')+c.name);
    let any=false;
    (c.topics||[]).forEach(t=>{
      const lessons=(t.lessons||[]).map(l=>({code:l.code,title:l.title}));
      lessons.forEach(l=>{
        LESSON_TITLE.set(key+'|'+l.code,l.title);
        if(LESSON_ANY.has(l.code)){if(LESSON_ANY.get(l.code)!==l.title)LESSON_AMBIG.add(l.code)}
        else LESSON_ANY.set(l.code,l.title);
      });
      if(lessons.length){TOPICS.push({label:(t.num?t.num+' ':'')+t.name,num:t.num||'',name:t.name||'',course:key,lessons});any=true}
    });
    if(any&&!COURSES.some(x=>x.key===key))COURSES.push({key,label,name:c.name||label,year:y.name||''});
  }));
  fillSelect($('aCourse'),[''].concat(COURSES.map(c=>c.key)),false,v=>v?(COURSES.find(c=>c.key===v)||{}).label:'— choose —');
  fillSelect($('kCourse'),[''].concat(COURSES.map(c=>c.key)),true,v=>v?(COURSES.find(c=>c.key===v)||{}).label:'— not set —');
  fillBookTopics();
  if($('nTopic'))fillNTopics();
}

  const cc=classCourse($('bClass').value);
  const idxs=TOPICS.map((t,i)=>i).filter(i=>!cc||TOPICS[i].course===cc);

const rKey=(kind,cls,item,id)=>kind+'|'+cls+'|'+item+'|'+id;

    students.forEach(s=>{
      const m=numOrNull(getRes(kind,cls,it.item,s.id));
      const td=box.querySelector('td.rc[data-id="'+CSS.escape(s.id)+'"][data-item="'+it.item+'"]');
      const p=(m!=null&&okOut)?m/out*100:null;
      if(m!=null)marks.push(m);
      if(p!=null)pctByStudent.get(s.id).push(p);
      if(td){
        td.querySelector('.rp').textContent=fmtP(p,0);
        td.style.background=pctBg(p);
        td.querySelector('.rmk').classList.toggle('over',m!=null&&okOut&&m>out);
      }
    });
    const cm=meanOf(marks),cs=sdOf(marks);
    const cp=(cm!=null&&okOut)?cm/out*100:null;
    if(cp!=null)classPcts.push(cp);
    setS('cm',it.item,fmt(cm,1));
    setS('cp',it.item,fmtP(cp,1));
    if(K.course){
      const km=numOrNull(it.cmean),ks=numOrNull(it.csd);
      const crp=(km!=null&&okOut)?km/out*100:null;
      setS('csd',it.item,fmt(cs,2));
      setS('crp',it.item,fmtP(crp,1));
      setS('dif',it.item,(cp!=null&&crp!=null)?fmtS(cp-crp,1):'');
      setS('csp',it.item,(cs!=null&&okOut)?fmtP(cs/out*100,1):'');
      setS('crsp',it.item,(ks!=null&&okOut)?fmtP(ks/out*100,1):'');
    }
  });
  const avgs=[];
  students.forEach(s=>{
    const a=meanOf(pctByStudent.get(s.id));
    if(a!=null)avgs.push(a);
    const td=box.querySelector('td.ravg[data-id="'+CSS.escape(s.id)+'"]');
    if(td){td.textContent=fmtP(a,0);td.style.background=pctBg(a)}
  });
  const all=box.querySelector('[data-s="cp-all"]');
  if(all)all.textContent=fmtP(meanOf(avgs),1);
}
function resultsFor(kind){
  const K=RES_KINDS[kind];
  $(K.cls).onchange=()=>drawResults(kind);
  const box=$(K.box);
  const itemOf=el=>S.ritems.find(r=>r.kind===kind&&r.class===$(K.cls).value&&r.item===el.dataset.item);
  box.addEventListener('input',ev=>{
    const el=ev.target;
    if(el.classList.contains('rmk')){
      setRes(kind,$(K.cls).value,el.dataset.item,el.dataset.id,el.value.trim());
      calcResults(kind);
    }else if(el.dataset.f){
      const it=itemOf(el);if(it){it[el.dataset.f]=el.value;calcResults(kind)}
    }
  });
  box.addEventListener('change',()=>{persist()});
  box.addEventListener('keydown',ev=>{
    if(ev.key!=='Enter'||!ev.target.classList.contains('rmk'))return;
    ev.preventDefault();
    const col=[...box.querySelectorAll('.rmk[data-item="'+ev.target.dataset.item+'"]')];
    const nxt=col[col.indexOf(ev.target)+1];
    if(nxt){nxt.focus();nxt.select()}
  });
  box.addEventListener('click',async ev=>{
    const b=ev.target.closest('[data-del]');if(!b)return;
    const cls=$(K.cls).value,it=S.ritems.find(r=>r.kind===kind&&r.class===cls&&r.item===b.dataset.del);
    if(!it)return;
    const n=[...S.res.values()].filter(r=>r.kind===kind&&r.class===cls&&r.item===it.item).length;
    if(!confirm('Delete '+(it.name||K.label)+' for '+cls+(n?' and its '+n+' mark'+(n===1?'':'s'):'')+'?'))return;
    S.ritems=S.ritems.filter(r=>r!==it);
    [...S.res].forEach(([k,r])=>{if(r.kind===kind&&r.class===cls&&r.item===it.item)S.res.delete(k)});
    drawResults(kind);await persist();
  });
  $(kind==='lsq'?'lAdd':'mAdd').onclick=async()=>{
    const cls=$(K.cls).value;
    if(!S.loaded){$(K.msg).textContent='Open your folder or files first.';return}
    if(!cls){$(K.msg).textContent='Choose a class first.';return}
    const items=itemsFor(kind,cls);
    const n=items.reduce((m,r)=>Math.max(m,+r.item||0),0)+1;
    const last=items[items.length-1];
    S.ritems.push({class:cls,kind,item:String(n),name:K.label+' '+n,outof:last?last.outof:(kind==='lsq'?'10':''),cmean:'',csd:''});
    drawResults(kind);await persist();
  };
}
resultsFor('lsq');resultsFor('task');

/* ---------- N-awards ---------- */
async function loadNawardConfig(){
  try{const r=await fetch('./naward.json',{cache:'no-store'});
    if(r.ok){const j=await r.json();NAWARD={classroomCodes:j.classroomCodes||{},outcomes:j.outcomes||{}}}}catch(e){}
  if($('nTopic'))nPrefill();
}
function nChecked(){return [...document.querySelectorAll('#nStudents .nchk:checked')].map(i=>i.value)}
function drawNStudents(cls){
  const keep=new Set(nChecked());
  $('nStudents').innerHTML=studentsIn(cls).map(s=>'<label style="display:flex;gap:6px;align-items:center;padding:2px 0;font-size:14px"><input type="checkbox" class="nchk" value="'+esc(s.id)+'"'+(keep.has(s.id)?' checked':'')+'>'+esc(s.last)+', '+esc(s.first)+'</label>').join('')||'<p class="empty">No students.</p>';
}
function contactKeys(n){return n>=3?['crt','ht','dp']:n===2?['crt','ht']:['crt']}
function nawFor(id){return S.naw.filter(r=>r.id===id).sort((a,b)=>(+a.number||0)-(+b.number||0)||a.date.localeCompare(b.date))}
function nTopicObj(){const v=$('nTopic').value;return v===''?null:TOPICS[+v]}
function nPrefill(){
  const cls=$('nClass').value,topic=nTopicObj();
  if(!topic){$('nOutcomes').value='';$('nDetail').value='';return}
  const key=topic.course+'|'+topic.num;
  $('nOutcomes').value=(NAWARD.outcomes[key]||[]).join('\n');
  const codes=topic.lessons.map(l=>l.code).join(', ');
  const cc=NAWARD.classroomCodes[cls]||NAWARD.classroomCodes[classCourse(cls)]||'xxxxx';
  $('nDetail').value='Student to complete all lessons and the Dorey’s Resource Book (DRB) for '+topic.name+': '+codes+'. All lessons and the DRB can be found on OneNote or Google Classroom (code: '+cc+').';
}
function fillNTopics(){
  const cc=classCourse($('nClass').value);
  const idxs=TOPICS.map((t,i)=>i).filter(i=>!cc||TOPICS[i].course===cc);
  fillSelect($('nTopic'),idxs.map(String),true,v=>TOPICS[+v].label);
  nPrefill();
}
function drawNaw(){
  const box=$('nList');
  if(!S.loaded){box.innerHTML='<p class="empty">Open your folder or files first.</p>';return}
  const cls=$('nClass').value;
  drawNStudents(cls);
  const students=studentsIn(cls).filter(s=>nawFor(s.id).length);
  if(!students.length){box.innerHTML='<p class="empty">No warnings logged for this class yet.</p>';return}
  box.innerHTML='<table><thead><tr><th>Student</th><th>Warnings</th></tr></thead><tbody>'+
    students.map(s=>'<tr><td>'+esc(fullName(s))+'</td><td>'+
      nawFor(s.id).map(r=>{const res=r.status==='resolved';return '<div style="margin:3px 0 7px"><span class="tag nt" data-id="'+esc(r.id)+'" data-num="'+esc(r.number)+'" data-date="'+esc(r.date)+'" title="'+esc((r.detail||'')+'\n\n'+(res?'Resolved':'Unresolved')+' — click to switch, right-click to delete')+'" style="cursor:pointer;color:#fff;border:0;background:'+(res?'#15803D':'#C0392B')+'">#'+esc(r.number||'?')+' '+esc(r.topic||'')+' · '+esc(showShort(r.date))+' · '+(res?'Resolved':'Unresolved')+'</span> '+
        '<span class="note" style="margin:0 0 0 6px">Parent contacted:</span> '+contactKeys(+r.number).map(k=>'<label style="font-size:12px;margin-left:8px">'+k.toUpperCase()+' <input type="date" class="nd" data-f="'+k+'" data-id="'+esc(r.id)+'" data-num="'+esc(r.number)+'" data-date="'+esc(r.date)+'" value="'+esc(r[k]||'')+'" style="font-size:12px;padding:1px 3px"></label>').join('')+'</div>'}).join('')+
      '</td></tr>').join('')+'</tbody></table>';
}
$('nClass').onchange=()=>{fillNTopics();drawNaw()};
$('nTopic').onchange=nPrefill;
$('nAll').onclick=()=>document.querySelectorAll('#nStudents .nchk').forEach(i=>i.checked=true);
$('nNone').onclick=()=>document.querySelectorAll('#nStudents .nchk').forEach(i=>i.checked=false);
$('nAdd').onclick=async()=>{
  const ids=nChecked();
  const date=$('nDate').value||todayISO(),topic=nTopicObj();
  if(!S.loaded){$('nMsg').textContent='Open your folder or files first.';return}
  if(!ids.length){$('nMsg').textContent='Choose at least one student.';return}
  if(!topic){$('nMsg').textContent='Choose a topic.';return}
  const outcomes=$('nOutcomes').value.trim(),detail=$('nDetail').value.trim();
  ids.forEach(id=>{
    const num=nawFor(id).reduce((m,r)=>Math.max(m,+r.number||0),0)+1;
    S.naw.push({id,date,number:String(num),topic:topic.label,outcomes,detail,status:'unresolved',crt:'',ht:'',dp:''});
  });
  S.naw.sort((a,b)=>a.id.localeCompare(b.id)||(+a.number||0)-(+b.number||0));
  $('nMsg').textContent='Warning logged for '+ids.length+' student'+(ids.length>1?'s':'')+' ('+topic.label+').';
  await persist();drawNaw();drawDash();
};
$('nList').onchange=async ev=>{
  const i=ev.target.closest('.nd');if(!i)return;
  const r=nFind(i);if(!r)return;
  r[i.dataset.f]=i.value;
  await persist();
};
function nFind(el){return S.naw.find(x=>x.id===el.dataset.id&&x.number===el.dataset.num&&x.date===el.dataset.date)}
$('nList').onclick=async ev=>{
  const b=ev.target.closest('.nt');if(!b)return;
  const r=nFind(b);if(!r)return;
  r.status=r.status==='resolved'?'unresolved':'resolved';
  await persist();drawNaw();drawDash();
};
$('nList').oncontextmenu=async ev=>{
  const b=ev.target.closest('.nt');if(!b)return;
  ev.preventDefault();
  const r=nFind(b);if(!r)return;
  if(!confirm('Delete warning #'+r.number+' ('+r.topic+') for '+nameOf(r.id)+'?'))return;
  S.naw=S.naw.filter(x=>x!==r);
  await persist();drawNaw();drawDash();
};

/* ---------- N-award tracker sheet (A4, one page per student) ---------- */
function courseInfo(cls){const k=classCourse(cls);return COURSES.find(c=>c.key===k)||{name:'',year:''}}
function nSheetHTML(st){
  const ci=courseInfo(st.class),ws=nawFor(st.id),by={};
  ws.forEach(r=>{const n=+r.number;if(n>=1&&!by[n])by[n]=r});
  const year=ci.year||'',title=(year?year+' ':'')+'Mathematics N-Award Tracker';
  let h='<div class="natPage"><h2>'+esc(title)+'</h2><table class="natHead">'+
    '<tr><td class="l">Student Name:</td><td>'+esc(fullName(st))+'</td></tr>'+
    '<tr><td class="l">Teacher Name:</td><td style="text-align:center">Dorey</td></tr>'+
    '<tr><td class="l">Course Name:</td><td style="text-align:center">'+esc(ci.name||'')+'</td></tr></table>';
  for(let n=1;n<=5;n++){
    const r=by[n],res=r&&r.status==='resolved';
    const contact=contactKeys(n);
    const opts=['TUTORIAL TIMES','DETENTION'];
    h+='<div class="natSec'+(n===5?' natLast':'')+'">'+
      '<div><div class="hd">LETTER</div><div class="num">'+n+'</div></div>'+
      '<div><div class="hd">DATE SENT</div><div class="cell">'+(r?'<strong>'+esc(r.date.split('-').reverse().join('/'))+'</strong><div class="top">'+esc(r.topic||'')+'</div>':'')+'</div></div>'+
      '<div><div class="hd">DATE PARENT CONTACT</div><div class="cell">'+contact.map(c=>'<div class="line"><span style="width:9mm">'+c.toUpperCase()+':</span><span class="fld" style="padding:0 1.5mm;line-height:4.4mm;font-size:8.5pt">'+(r&&r[c]?esc(r[c].split('-').reverse().join('/')):'')+'</span></div>').join('')+'</div></div>'+
      '<div><div class="hd">SUPPORTS OFFERED</div>'+opts.map(o=>'<div class="opt"><span>'+o+'</span><span class="bx"></span></div>').join('')+'</div>'+
      '<div style="border-right:0"><div class="hd">RESOLVED</div><div class="yn">YES<span class="bx">'+(res?'✓':'')+'</span> NO<span class="bx">'+(r&&!res?'✓':'')+'</span></div></div>'+
    '</div>';
  }
  const extra=ws.filter(r=>+r.number>5).length;
  if(extra)h+='<p style="font-size:8pt;margin:2mm 0 0">+ '+extra+' further warning'+(extra>1?'s':'')+' not shown (this sheet holds five letters).</p>';
  return h+'</div>';
}
$('nSheet').onclick=()=>{
  if(!S.loaded){$('nMsg').textContent='Open your folder or files first.';return}
  const ids=nChecked(),sts=ids.map(rowOf).filter(Boolean).sort(cmpRow);
  if(!sts.length){$('nMsg').textContent='Tick the students to print sheets for.';return}
  const withW=sts.filter(st=>nawFor(st.id).length);
  if(!withW.length){$('nMsg').textContent='None of the ticked students have a warning logged yet.';return}
  $('nMsg').textContent='Printing '+withW.length+' sheet'+(withW.length>1?'s':'')+(withW.length<sts.length?' (skipped '+(sts.length-withW.length)+' with no warnings)':'')+' — choose "Save as PDF", A4.';
  $('printArea').innerHTML=withW.map(nSheetHTML).join('');
  window.print();
};

/* ---------- Dashboard ---------- */
function missPill(n){
  if(!n)return '<span class="note" style="margin:0">0</span>';
  const bg=n>=8?'#C0392B':n>=4?'#D9850A':'';
  return bg?'<span style="display:inline-block;min-width:28px;padding:1px 10px;border-radius:999px;color:#fff;font-weight:600;background:'+bg+'">'+n+'</span>':'<span style="font-weight:600">'+n+'</span>';
}
function lsqAverage(cls,students){
  const items=itemsFor('lsq',cls),avgs=[];
  students.forEach(s=>{
    const ps=[];
    items.forEach(it=>{const out=numOrNull(it.outof),m=numOrNull(getRes('lsq',cls,it.item,s.id));if(m!=null&&out>0)ps.push(m/out*100)});
    if(ps.length)avgs.push(meanOf(ps));
  });
  return meanOf(avgs);
}
function drawDashTiles(cls,students){
  const ids=new Set(students.map(s=>s.id)),to=$('dEnd').value||todayISO(),since=addDays(to,-13);
  const away=S.abs.filter(r=>r.class===cls&&ids.has(r.id)&&r.date>=since&&r.date<=to).length;
  const open=S.naw.filter(r=>ids.has(r.id)&&r.status!=='resolved').length;
  const act=new Set();
  S.book.forEach((v,k)=>{const i=k.indexOf('|');if(ids.has(k.slice(0,i)))act.add(k.slice(i+1))});
  const owing=students.filter(s=>[...act].some(l=>!S.book.has(bKey(s.id,l)))).length;
  const lsq=lsqAverage(cls,students);
  const tile=(n,l,c)=>'<div class="tile'+(c?' '+c:'')+'"><b>'+n+'</b><span>'+l+'</span></div>';
  $('dTiles').innerHTML=tile(students.length,'Students')+tile(away,'Absences this fortnight',away?'warn':'good')+tile(open,'Open N-awards',open?'bad':'good')+tile(owing,'Students owing book work',owing?'warn':'good')+tile(lsq==null?'–':fmt(lsq,0)+'%','LSQ average');
}
function drawFortnight(cls,students){
  const to=$('dEnd').value||todayISO(),from=addDays(to,-13),n=Math.max(1,+$('dN').value||8);
  const reasons=getReasons().map(rName);
  const rows=students.map(st=>{
    const abs=S.abs.filter(r=>r.id===st.id&&r.class===cls&&r.date>=from&&r.date<=to);
    const away=new Set(abs.map(r=>r.date+'|'+r.period)).size;
    const by={};abs.forEach(r=>{const k=reasons.includes(r.reason)?r.reason:(r.reason||'Other');by[k]=(by[k]||0)+1});
    return {name:fullName(st),away,by,pct:Math.max(0,Math.round((1-away/n)*100))};
  });
  const pill=p=>'<span style="display:inline-block;min-width:46px;padding:2px 8px;border-radius:999px;background:'+attColour(p)+';color:#fff;font-weight:600;text-align:center">'+p+'%</span>';
  const avg=Math.round(meanOf(rows.map(r=>r.pct)));
  $('dFort').innerHTML='<table><thead><tr><th>Student</th><th class="n">Away</th><th class="n">Attendance</th><th>Reasons</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td class="n">'+r.away+'</td><td class="n">'+pill(r.pct)+'</td><td>'+Object.keys(r.by).map(k=>'<span class="tag">'+esc(k)+(r.by[k]>1?' ×'+r.by[k]:'')+'</span>').join('')+'</td></tr>').join('')+
    '</tbody><tfoot><tr><th>Class</th><th class="n">'+rows.reduce((a,r)=>a+r.away,0)+'</th><th class="n">'+pill(avg)+'</th><th></th></tr></tfoot></table>';
}
function drawDash(){
  const box=$('dList');
  if(!S.loaded){$('dTiles').innerHTML='';$('dFort').innerHTML='';box.innerHTML='<p class="empty">Open your folder or files first.</p>';return}
  const cls=$('dClass').value,students=studentsIn(cls);
  if(!students.length){$('dTiles').innerHTML='';$('dFort').innerHTML='';box.innerHTML='<p class="empty">No students in this class.</p>';return}
  const idset=new Set(students.map(s=>s.id)),active=new Set();
  drawDashTiles(cls,students);drawFortnight(cls,students);
  S.book.forEach((v,k)=>{const i=k.indexOf('|');if(idset.has(k.slice(0,i)))active.add(k.slice(i+1))});
  const lessons=[...active].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  box.innerHTML='<table><thead><tr><th>Student</th><th>N-awards resolved</th><th>N-awards unresolved</th><th>Total missed</th><th>Missed lessons</th></tr></thead><tbody>'+
    students.map(s=>{
      const n=nawFor(s.id),res=n.filter(r=>r.status==='resolved').length,un=n.length-res;
      const owed=lessons.filter(l=>!S.book.has(bKey(s.id,l)));
      return '<tr><td>'+esc(s.last)+', '+esc(s.first)+'</td><td style="text-align:center;color:#15803D;font-weight:600">'+res+'</td><td style="text-align:center;color:'+(un?'#C0392B':'inherit')+';font-weight:600">'+un+'</td><td style="text-align:center">'+missPill(owed.length)+'</td><td>'+
        (owed.map(l=>'<span class="tag">'+esc(l)+'</span>').join('')||'<span class="note" style="margin:0">None</span>')+'</td></tr>'}).join('')+'</tbody></table>';
}
$('dClass').onchange=drawDash;$('dEnd').oninput=drawDash;$('dN').oninput=drawDash;
